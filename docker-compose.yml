services:
  web:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: estudiante
      DB_PASSWORD: clave_solo_practica
      DB_NAME: students_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: estudiante
      POSTGRES_PASSWORD: clave_solo_practica
      POSTGRES_DB: students_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_students.sql:/docker-entrypoint-initdb.d/01-students.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U estudiante -d students_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data: